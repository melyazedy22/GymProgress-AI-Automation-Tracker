<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitWave · My profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="coach.html">Fit<span>Wave</span></a>
    <nav class="nav">
      <span id="topbar-user" class="user-chip"></span>
      <a href="profile.html" data-nav="profile">Profile</a>
      <a href="coach.html" data-nav="coach">AI Coach</a>
      <button id="logout-btn" class="btn btn-ghost" type="button">Log out</button>
    </nav>
  </header>

  <main class="container stack">
    <div class="card banner">
      <div>
        <h2 id="hello">Your profile</h2>
        <p class="muted" id="membership"></p>
      </div>
      <a class="btn btn-ghost" href="coach.html">Go to AI coach →</a>
    </div>

    <div id="page-msg" class="alert" hidden></div>

    <div class="grid-2">
      <form id="profile-form" class="card">
        <h3>Fitness profile</h3>
        <div class="field-row">
          <div class="field">
            <label for="age">Age</label>
            <input id="age" name="age" type="number" min="12" max="90" step="1" required>
          </div>
          <div class="field">
            <label for="height">Height (cm)</label>
            <input id="height" name="height_cm" type="number" min="120" max="230" step="0.1" required>
          </div>
          <div class="field">
            <label for="weight">Weight (kg)</label>
            <input id="weight" name="weight_kg" type="number" min="30" max="250" step="0.1" required>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="goal">Main goal</label>
            <select id="goal" name="goal" required>
              <option value="">Choose…</option>
              <option value="fat_loss">Fat loss</option>
              <option value="muscle_gain">Muscle gain</option>
              <option value="strength">Strength</option>
              <option value="endurance">Endurance</option>
              <option value="general_fitness">General fitness</option>
            </select>
          </div>
          <div class="field">
            <label for="level">Experience</label>
            <select id="level" name="experience_level" required>
              <option value="">Choose…</option>
              <option value="beginner">Beginner (under 6 months)</option>
              <option value="intermediate">Intermediate (6 months – 2 years)</option>
              <option value="advanced">Advanced (2+ years)</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="injuries">Injuries or pain <span class="muted">(optional)</span></label>
          <textarea id="injuries" name="injuries" maxlength="500" dir="auto" placeholder="e.g. old left knee injury, lower back pain. Leave empty if none."></textarea>
        </div>
        <div class="field">
          <label for="diet">Diet preference or allergies <span class="muted">(optional)</span></label>
          <textarea id="diet" name="diet_preference" maxlength="300" dir="auto" placeholder="e.g. vegetarian, no dairy, allergic to nuts"></textarea>
        </div>
        <button class="btn" type="submit">Save profile</button>
      </form>

      <aside class="card stack">
        <h3>Summary</h3>
        <div>
          <div class="banner small"><span>Profile completeness</span><span id="complete-pct">0%</span></div>
          <div class="progress"><div id="complete-bar"></div></div>
        </div>
        <div class="stats">
          <div class="stat"><b id="bmi">–</b><small>BMI</small></div>
          <div class="stat"><b id="bmi-cat">–</b><small>Category</small></div>
        </div>
        <div>
          <strong>Risk flags</strong>
          <div class="chips" id="flags"></div>
        </div>
        <p class="hint">Risk flags make the AI coach add extra safety notes. They are not a diagnosis.</p>
      </aside>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    const session = FW.requireSession();
    FW.renderTopbar('profile');
    const { el } = FW;

    const form = document.getElementById('profile-form');
    const msg = document.getElementById('page-msg');
    document.getElementById('membership').textContent = FW.membershipText(session.membership);
    if (session.full_name) document.getElementById('hello').textContent = `Hi ${session.full_name.split(' ')[0]}, this is your profile`;

    const FIELDS = ['age', 'height_cm', 'weight_kg', 'goal', 'experience_level', 'injuries', 'diet_preference'];
    const REQUIRED = ['age', 'height_cm', 'weight_kg', 'goal', 'experience_level'];
    const FLAG_LABELS = {
      under_18: 'Under 18', very_low_bmi: 'Very low BMI', high_bmi: 'High BMI', has_injury: 'Injury reported',
      knee_injury: 'Knee', back_injury: 'Back', shoulder_injury: 'Shoulder'
    };

    function fill(p) { FIELDS.forEach(f => { if (form.elements[f]) form.elements[f].value = (p && p[f] != null) ? p[f] : ''; }); }
    function bmiCategory(b) { return b < 18.5 ? 'Underweight' : b < 25 ? 'Normal' : b < 30 ? 'Overweight' : 'Obesity'; }

    function renderSummary(p) {
      const done = REQUIRED.filter(f => p && p[f] !== null && p[f] !== undefined && p[f] !== '').length;
      const pct = Math.round(done / REQUIRED.length * 100);
      document.getElementById('complete-bar').style.width = pct + '%';
      document.getElementById('complete-pct').textContent = pct + '%';
      document.getElementById('bmi').textContent = (p && p.bmi) ? p.bmi : '–';
      document.getElementById('bmi-cat').textContent = (p && p.bmi) ? bmiCategory(Number(p.bmi)) : '–';
      const flags = (p && Array.isArray(p.risk_flags)) ? p.risk_flags : [];
      document.getElementById('flags').replaceChildren(
        ...(flags.length ? flags.map(f => el('span', { class: 'chip' }, FLAG_LABELS[f] || f)) : [el('span', { class: 'chip ok' }, 'None')])
      );
      FW.updateSession({ profile_complete: pct === 100 });
    }

    async function load() {
      const r = await FW.coach('get_profile');
      if (!r.data.success) { FW.showMessage(msg, r.data.message || 'Could not load your profile.', 'error'); return; }
      fill(r.data.profile);
      renderSummary(r.data.profile);
      if (r.data.missing_fields && r.data.missing_fields.length) {
        FW.showMessage(msg, 'Please complete the missing fields so the AI coach can build your plans.', 'info');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('button[type=submit]');
      FW.setBusy(btn, true, 'Saving…');
      const r = await FW.coach('save_profile', Object.fromEntries(new FormData(form)));
      FW.setBusy(btn, false);
      if (r.data.success) {
        fill(r.data.profile);
        renderSummary(r.data.profile);
        FW.showMessage(msg, el('span', {}, 'Profile saved. ', el('a', { href: 'coach.html' }, 'Get your plan from the AI coach →')), 'ok');
      } else {
        FW.showMessage(msg, (r.data.errors && r.data.errors.join(' ')) || r.data.message || 'Could not save your profile.', 'error');
      }
    });

    load();
  </script>
</body>
</html>
